server.port=8081
spring.application.name=intervueai-security-service

# Logging
logging.level.com.intervueai=DEBUG
logging.level.org.springframework.web=INFO

# CORS
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
